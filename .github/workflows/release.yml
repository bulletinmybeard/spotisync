name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag for release (e.g., v0.9.1, v1.0.0)'
        required: true
        type: string
      publish_to_pypi:
        description: 'Publish to PyPI (production)'
        required: true
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '2.1.4'

jobs:
  build:
    name: Build Python Package
    runs-on: ubuntu-latest

    steps:
      - name: Set tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Build package
        run: |
          poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true

    steps:
      - name: Set tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          poetry publish --no-interaction

      - name: Verify PyPI publication
        run: |
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION="${VERSION#v}"
          sleep 30
          pip install spotisync==$VERSION

  create-github-release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true)
    permissions:
      contents: write

    steps:
      - name: Set tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Generate SHA256 checksums
        run: |
          cd dist/
          sha256sum *.whl *.tar.gz > checksums.txt
          cat checksums.txt
          cd ..

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate comprehensive release notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.tag.outputs.name }}"
          REPO="${{ github.repository }}"
          BACKTICKS='```'

          # Extract changelog section for this version
          # Use awk to get content from version header to next version header (or EOF)
          CHANGELOG_SECTION=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md || echo "")

          echo "DEBUG: Extracted changelog section length: ${#CHANGELOG_SECTION}"

          CHECKSUMS=$(cat dist/checksums.txt || echo "")

          # Check if we have changelog content
          if [ -n "$CHANGELOG_SECTION" ] && [ "${#CHANGELOG_SECTION}" -gt 10 ]; then
            HAS_BREAKING_CHANGES=$(echo "$CHANGELOG_SECTION" | grep -qi "breaking change" && echo "true" || echo "false")

            cat > release_notes.md <<EOF
          ## Installation

          ${BACKTICKS}bash
          pipx install spotisync
          ${BACKTICKS}

          ## Distribution Links

          | Platform | Link |
          |----------|------|
          | **PyPI** | [spotisync v${VERSION}](https://pypi.org/project/spotisync/${VERSION}/) |
          | **Documentation** | [README](https://github.com/${REPO}#readme) |

          ## What's Changed

          ${CHANGELOG_SECTION}

          EOF

            if [ "$HAS_BREAKING_CHANGES" = "true" ]; then
              cat >> release_notes.md <<EOF

          ## Upgrade Notes

          This release contains breaking changes. Please review the changelog above before upgrading.

          EOF
            fi

          else
            # Fallback if no changelog section found
            cat > release_notes.md <<EOF
          ## Installation

          ${BACKTICKS}bash
          pipx install spotisync
          ${BACKTICKS}

          ## Release Notes

          Release version ${VERSION}

          See full changelog at: https://github.com/${REPO}/blob/master/CHANGELOG.md

          EOF
          fi

          # Add checksums table
          cat >> release_notes.md <<'CHECKSUMS_HEADER'

          ## Package Checksums (SHA256)

          | File | SHA256 |
          |------|--------|
          CHECKSUMS_HEADER

          echo "$CHECKSUMS" | while read -r hash filename; do
            [ -n "$hash" ] && printf '| `%s` | `%s` |\n' "$filename" "$hash" >> release_notes.md
          done

          # Add footer
          cat >> release_notes.md <<EOF

          ---

          **Full Changelog**: https://github.com/${REPO}/blob/master/CHANGELOG.md

          **First time using SpotiSync?** Check out the [Quick Start Guide](https://github.com/${REPO}#quick-start)
          EOF

          # Remove leading whitespace from heredoc content
          sed -i 's/^          //' release_notes.md

          echo "DEBUG: Final release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, 'alpha') || contains(steps.tag.outputs.name, 'beta') || contains(steps.tag.outputs.name, 'rc') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Release Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ steps.tag.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PyPI**: https://pypi.org/project/spotisync/${{ steps.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pipx install spotisync" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
